name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    # WPF/STA 测试需要 Windows runner；pwsh 7 已预装
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run parser check and PowerShell regression tests
        shell: pwsh
        run: ./tests/run-all.ps1

  static-analysis:
    # 只报 Error/Warning；豁免规则与理由在 PSScriptAnalyzerSettings.psd1。
    # 先装模块再跑，本地复现命令相同：pwsh -NoProfile -File tests/analyze.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -RequiredVersion 1.25.0
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./tests/analyze.ps1

  version-consistency:
    # VERSION 必须是合法 semver，且等于根 CHANGELOG.md 第一个 "## [x.y.z]"。
    # 发布脚本与 release workflow 都按 VERSION 取产物名，两边漂移就会发错包。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check VERSION is semver and matches CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw -Encoding UTF8).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "VERSION=[$version]"
            Write-Error 'VERSION 不是合法 semver（期望 x.y.z）'
            exit 1
          }
          $section = Get-Content ./CHANGELOG.md -Encoding UTF8 |
            Where-Object { $_ -match '^##\s*\[(\d+\.\d+\.\d+)\]' } |
            Select-Object -First 1
          if (-not $section) {
            Write-Host "VERSION=[$version]"
            Write-Error 'CHANGELOG.md（仓根）里找不到形如 "## [x.y.z]" 的版本小节'
            exit 1
          }
          $changelogVersion = [regex]::Match($section, '^##\s*\[(\d+\.\d+\.\d+)\]').Groups[1].Value
          if ($changelogVersion -ne $version) {
            Write-Host "VERSION=[$version]"
            Write-Host "CHANGELOG 首节=[$changelogVersion]"
            Write-Error "版本不一致：VERSION=[$version] vs CHANGELOG=[$changelogVersion]"
            exit 1
          }
          Write-Host "OK: VERSION 与 CHANGELOG 首节一致 = $version"

  secrets:
    # 本地有 .githooks/pre-commit 兜底，但那要每个 clone 手动 git config core.hooksPath
    # 才生效，也覆盖不到「网页直接提交 / fork 后提 PR」。CI 这一层是独立的。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 全历史：gitleaks 按提交范围扫，浅克隆会扫不到东西
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
