name: release

# 打 tag（如 v0.9.0）即发布：VERSION 必须与 tag 一致，否则先修再发。
# 产物是 scripts/package-release.ps1 生成的 zip（脚本 + example 配置 + README，不含本机清单）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 同一 ref 的发布串行执行；不取消进行中的发布（半个 release 比晚发布更糟）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw -Encoding UTF8).Trim()
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tag) { throw "VERSION ($version) 与 tag ($tag) 不一致" }

      - name: Regression tests
        shell: pwsh
        run: ./tests/run-all.ps1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -RequiredVersion 1.25.0

      - name: Static analysis
        shell: pwsh
        run: ./tests/analyze.ps1

      - name: Build zip
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 精确取本次版本的产物；不要按 LastWriteTime 挑最后一个（dist/ 有多个残留时会传错包）
          $version = (Get-Content ./VERSION -Raw -Encoding UTF8).Trim()
          $zip = Join-Path (Get-Location) "dist/service-manager-$version.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "发布包不存在：$zip" }
          $tag = '${{ github.ref_name }}'
          gh release create $tag $zip --title $tag --generate-notes
          if ($LASTEXITCODE -ne 0) {
            # 幂等：tag 已发过（重跑 / 补传）就走覆盖上传，不整条 workflow 变红
            Write-Host "release $tag 已存在，改用 upload --clobber"
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload 失败（exit $LASTEXITCODE）" }
          }
